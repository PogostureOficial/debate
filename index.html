<style>

.round-actions{display:flex;gap:8px;flex-wrap:wrap}.mini{font-size:10px;padding:10px 12px}

.round-score.you{outline:3px solid var(--ye);outline-offset:2px;background:#33287a}.round-score.you span,.round-score.you b{color:var(--ye)}.round-score .you-tag{display:inline-block;margin-bottom:3px;padding:2px 6px;border:2px solid var(--ye);color:var(--ye);font-family:'Press Start 2P',monospace;font-size:9px;line-height:1.4}

.points-note{margin-top:18px;padding:10px;border:2px dashed var(--ye);color:var(--ye)}
.stats-grid{display:grid;gap:12px}.stats-card{background:var(--bg);border:3px solid var(--c);padding:12px}.stats-card h3{font-size:11px;color:var(--c);margin:0 0 10px}.stats-card p{margin:4px 0}
.log{margin-top:18px;padding:12px;background:var(--bg);border:3px solid var(--dim)}.log h2{margin:0 0 8px}.log ul{margin:0;padding-left:24px}.log li{padding:4px 0}
.event-log{margin:12px 0;padding:12px;border:3px solid var(--event-color,var(--dim));background:var(--panel)}.event-log h3{font-size:10px;color:var(--event-color,var(--cy));margin:0 0 8px}.event-log p{margin:0 0 8px}.event-log .eff{justify-content:flex-start}
@media(max-width:520px){main{padding:10px}.stat{grid-template-columns:100px 1fr 34px;gap:6px;font-size:20px}.row,.nation-sheet .row{grid-template-columns:1fr 56px}.row input{grid-column:1/-1;grid-row:2}.ava{width:84px;height:84px;font-size:46px}.round-scores{grid-template-columns:repeat(3,minmax(0,1fr))}.roundbox{align-items:flex-start}.timer{font-size:21px}.nation-sheet{padding:12px}}

$('#page').addEventListener('scroll',e=>{if(e.target.matches('.admin-event-list'))updateAdminEventArrows()},true);
let provinceSwipeStart=null;document.addEventListener('touchstart',event=>{if(event.target.closest('.province-panels'))provinceSwipeStart={x:event.changedTouches[0].clientX,y:event.changedTouches[0].clientY}},{passive:true});document.addEventListener('touchend',event=>{if(!provinceSwipeStart)return;const dx=event.changedTouches[0].clientX-provinceSwipeStart.x,dy=event.changedTouches[0].clientY-provinceSwipeStart.y;provinceSwipeStart=null;if(Math.abs(dx)>48&&Math.abs(dx)>Math.abs(dy)){const order=['stats','events','improvements'],index=order.indexOf(provinceSection),next=dx<0?Math.min(order.length-1,index+1):Math.max(0,index-1);setProvinceSection(order[next])}},{passive:true});$('#page').addEventListener('scroll',e=>{if(e.target.matches('.province-events-list'))provinceEventsScrollTop=e.target.scrollTop},true);
$('#page').addEventListener('input',e=>{const id=e.target.dataset.money;if(!id)return;const others=totalAllocation()-Number(game.allocations[id]||0),value=Math.min(Number(e.target.value),BUDGET-others);game.allocations={...game.allocations,[id]:value};e.target.value=String(value);renderAllocationLive();clearTimeout(allocTimer);allocTimer=setTimeout(()=>{const a={...game.allocations};changeState(s=>({...s,allocations:a}),false).catch(console.warn)},180)});
window.addEventListener('hashchange',render);
setInterval(()=>{updateClock();tick()},500);
window.addEventListener('fondos-sync',()=>{const sync=window.fondosSync;if(!sync.ready)return;if(!sync.state||sync.state.stateVersion!==STATE_VERSION){if(!sync.migrating&&sync.update){sync.migrating=true;sync.update(current=>current?.stateVersion===STATE_VERSION?current:migrateState(current)).then(s=>{sync.state=s;sync.migrating=false;game=normalize(s);saveLocal();render()}).catch(err=>{sync.migrating=false;sync.status='No se pudo preparar la partida: '+err.message;render()})}return}const previous=game,next=normalize(sync.state),newEvents=enqueueNewEvents(previous,next),viewProvince=P.find(p=>SL[p.id]===location.hash.slice(1)),ownStatsChanged=viewProvince&&JSON.stringify(previous.stats?.[viewProvince.id])!==JSON.stringify(next.stats?.[viewProvince.id]),phaseChanged=previous.phase!==next.phase||previous.round!==next.round,allocationsChanged=JSON.stringify(previous.allocations)!==JSON.stringify(next.allocations),confirmedChanged=JSON.stringify(previous.confirmedAllocations)!==JSON.stringify(next.confirmedAllocations);game=next;saveLocal();if(location.hash==="#votacion")updateNationScoreboard();if(document.activeElement?.dataset?.money&&!newEvents){renderAllocationLive();return}if(newEvents)startNextToast();if(location.hash==='#admin'){updateAdminStats(previous,next);return}if(location.hash==='#moderator'){updateModeratorStats(previous,next);return}if(viewProvince){if(ownStatsChanged||newEvents)updateProvinceStatsInPlace(viewProvince,newEvents?activeToast:null);return}if(phaseChanged||(next.phase==='distribution'&&allocationsChanged)||(previous.phase==='waiting'&&confirmedChanged))render()});
window.addEventListener('fondos-sync',()=>{const sync=window.fondosSync,view=visibleProvince();if(!sync?.ready||!syncHydrated||activeToast||!view)return;const latest=(game.eventLog||[]).slice().reverse().find(event=>event.province===view.id&&Date.now()-(Number(event.at)||0)>=0&&Date.now()-(Number(event.at)||0)<5600);if(latest){restoreRecentToast();showActiveToast()}});
window.fondosReady?.then(()=>{const sync=window.fondosSync;if(sync.ready&&sync.state?.stateVersion===STATE_VERSION){game=normalize(sync.state);saveLocal();seedSeenEvents();if(!activeToast)restoreRecentToast();render()}});
render();

</script>
</body>
</html>
