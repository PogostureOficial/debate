.stats-grid{display:grid;gap:12px}.stats-card{background:var(--bg);border:3px solid var(--c);padding:12px}.stats-card h3{font-size:11px;color:var(--c);margin:0 0 10px}.stats-card p{margin:4px 0}

function toastMarkup(event){const viewProvince=visibleProvince();if(!viewProvince||viewProvince.id!==event.province)return '';const province=P.find(p=>p.id===event.province),age=Math.max(0,Date.now()-(Number(event.at)||Date.now())),entered=age>=1150,effects=(event.changes||[]).map(change=>{const delta=Number(change.delta)||0,kind=delta>0?'up':delta<0?'down':'neutral',stat=change.stat||'Estadística';return `<span class="event-toast-change ${kind}">${STAT_ICONS[stat]||''} ${statDisplayName(stat)} ${delta>0?'+':''}${delta}</span>`}).join('');return `<aside class="event-toast${entered?' no-rise':''}" role="status" aria-live="polite"${entered?'':` style="animation-delay:-${age}ms"`}><span class="event-toast-emoji" aria-hidden="true">${event.emoji||event.title?.split(' ')[0]||'⚠️'}</span><div class="event-toast-content"><strong class="event-toast-title">${event.title?.replace(/^\S+\s*/,'')||'Evento'}</strong><span class="event-toast-province">${province?.n||'Provincia afectada'}</span>${effects}</div></aside>`}

function updateEconomyProgress(){const indicator=$('#page [data-economy-progress]');if(!indicator)return;const anchor=Number(game.economyIncomeAt)||economyIncomeFallbackAt,progress=game.phase!=='prep'?0:Math.max(0,Math.min(1,(Date.now()-anchor)/10000));indicator.style.setProperty('--income-progress',`${(progress*100).toFixed(2)}%`)}async function grantPeriodicEconomy(){if(game.phase!=='prep')return;const now=Date.now(),sync=window.fondosSync;if(sync?.ready&&sync.update){let awarded=false;let saved;try{saved=await sync.update(current=>{awarded=false;if(!current||current.stateVersion!==STATE_VERSION)return;const state=normalize(current),last=Number(state.economyIncomeAt)||0;if(state.phase!=='prep'||now-last<10000)return;const stats={...state.stats};for(const province of P)stats[province.id]={...stats[province.id],Economía:(Number(stats[province.id]?.Economía)||0)+5};awarded=true;return {...state,stats,economyIncomeAt:now,economyChangeId:`economy-${now}-${Math.random().toString(36).slice(2,8)}`}})}catch(error){console.warn(error);return}if(!awarded||!saved)return;const previous=game,next=normalize(saved);game=next;animateEconomyDeltas(previous,next);setProvinceStats();saveLocal();if(location.hash==='#admin'){updateAdminStats(previous,next);return}if(location.hash==='#moderator'){updateModeratorStats(previous,next);return}const province=P.find(item=>SL[item.id]===location.hash.slice(1));if(province)updateProvinceStatsInPlace(province);if(location.hash==='#votacion'||location.hash==='#nacion')updateNationScoreboard();return}if(now-(Number(game.economyIncomeAt)||0)<10000)return;const previous=game,stats={...game.stats};for(const province of P)stats[province.id]={...stats[province.id],Economía:(Number(stats[province.id]?.Economía)||0)+5};const next=normalize({...game,stats,economyIncomeAt:now,economyChangeId:`economy-${now}-${Math.random().toString(36).slice(2,8)}`});game=next;animateEconomyDeltas(previous,next);setProvinceStats();saveLocal();if(location.hash==='#admin'){u
