window.fondosReady = (async()=>{
  if(!firebaseConfig?.apiKey || !firebaseConfig?.databaseURL) return;

})();

const PREP_MS=5*60*1000,ROUND_MS=10*60*1000,ROUNDS=5,BUDGET=100,STATE_VERSION=7;
const $=s=>document.querySelector(s),BASE=Object.fromEntries(P.map(p=>[p.id,{...p.s}]));
const blank=()=>({stateVersion:STATE_VERSION,stats:structuredClone(BASE),round:1,phase:'idle',phaseStartedAt:0,phaseEndsAt:0,allocations:Object.fromEntries(P.map(p=>[p.id,0])),confirmedAllocations:Object.fromEntries(P.map(p=>[p.id,0])),scheduledEvents:[],eventLog:[]});
let game=blank(),allocTimer=null,transitioning=false,toastQueue=[],activeToast=null,toastTimeout=null,queuedToastIds=new Set(),shownToastIds=new Set(),animatedToastIds=new Set();
const LOCAL_KEY='fondos-nacion-estado-v2';
function normalize(raw){if(!raw||raw.stateVersion!==STATE_VERSION)return blank();const clean=blank();return {...clean,...raw,stats:Object.fromEntries(P.map(p=>[p.id,{...BASE[p.id],...(raw.stats?.[p.id]||{})}])),allocations:Object.fromEntries(P.map(p=>[p.id,Math.max(0,Number(raw.allocations?.[p.id])||0)])),usedEvents:Array.isArray(raw.usedEvents)?raw.usedEvents:[],eventLog:Array.isArray(raw.eventLog)?raw.eventLog:[]}}
function migrateState(raw){if(!raw||raw.stateVersion!==6)return blank();const allocations=Object.fromEntries(P.map(p=>[p.id,Math.max(0,Number(raw.allocations?.[p.id])||0)])),stats=Object.fromEntries(P.map(p=>[p.id,{...BASE[p.id],...(raw.stats?.[p.id]||{})}])),confirmedAllocations=Object.fromEntries(P.map(p=>[p.id,0]));let phase=raw.phase,phaseEndsAt=Number(raw.phaseEndsAt)||0;if(phase==='distribution'){phase='ready';phaseEndsAt=0}if(phase==='round'){for(const p of P){stats[p.id].Economía=(Number(stats[p.id].Economía)||0)+(allocations[p.id]||0);confirmedAllocations[p.id]=allocations[p.id]}phase='waiting';phaseEndsAt=0}return normalize({...raw,stateVersion:STATE_VERSION,stats,phase,phaseEndsAt,allocations:phase==='ready'?Object.fromEntries(P.map(p=>[p.id,0])):allocations,confirmedAllocations})}
function saveLocal(){try{localStorage.setItem(LOCAL_KEY,JSON.stringify(game))}catch{}}
function loadLocal(){try{const saved=JSON.parse(localStorage.getItem(LOCAL_KEY)||'null');if(saved?.stateVersion===STATE_VERSION)game=normalize(saved);else if(saved?.stateVersion===6){game=migrateState(saved);saveLocal()}}catch{}}
loadLocal();
function setProvinceStats(){P.forEach(p=>p.s={...game.stats[p.id]})}
function render(){setProvinceStats();const hash=location.hash.slice(1),p=P.find(x=>SL[x.id]===hash);document.body.classList.toggle('province-view',!!p);document.documentElement.classList.toggle('province-view',!!p);if(p)$('#page').innerHTML=provincePage(p);else $('#page').innerHTML=nationPage();const sync=$('#sync-status');if(sync)sync.textContent=window.fondosSync?.status||'Estado local';if(activeToast)$('#page').insertAdjacentHTML('beforeend',toastMarkup(activeToast));if(!p)window.scrollTo(0,0)}
function updateProvinceStatsInPlace(p,event=null){const stats=game.stats[p.id]||{};for(const [name,value] of Object.entries(stats)){if(name==='Seguridad')continue;const row=$(`#page [data-stat="${CSS.escape(name)}"]`),valueNode=row?.querySelector('.province-stat-value');if(!valueNode)continue;valueNode.firstChild?.nodeType===Node.TEXT_NODE?valueNode.firstChild.textContent=String(value):valueNode.insertBefore(document.createTextNode(String(value)),valueNode.firstChild);if(event){const change=event.changes?.find(item=>item.stat===name),delta=Number(change?.delta)||0;if(delta){const marker=document.createElement('span');marker.className=`stat-delta-float ${delta>0?'up':'down'}`;marker.setAttribute('aria-label',`${delta>0?'Subió':'Bajó'} ${Math.abs(delta)}`);marker.textContent=`${delta>0?'+':''}${delta}`;valueNode.append(marker);setTimeout(()=>marker.remove(),3900)}}}}
function phaseLabel(){return ({idle:'Partida sin iniciar',prep:'Preparación',ready:'Debate listo',distribution:'Debate en curso · reparto',waiting:'Esperando siguiente ronda',finished:'Partida finalizada'})[game.phase]||'Partida'}
function roundTheme(){return ROUND_THEMES[game.round]||'Todas las áreas'}
function timeLeft(){return Math.max(0,Math.ceil((Number(game.phaseEndsAt||0)-Date.now())/1000))}
function clockMarkup(){const show=game.phase==='prep'||game.phase==='distribution';return `<div class="roundbox"><div><strong>RONDA ${Math.min(game.round,ROUNDS)} / ${ROUNDS}</strong><div class="phase-label">${phaseLabel()}</div></div>${show?`<span class="timer" data-clock="${game.phaseEndsAt}">${formatTime(timeLeft())}</span>`:''}</div>`}
function formatTime(seconds){return `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`}
function scoreRows(source=game.allocations,confirmed=false){return `<div class="round-scores">${P.map(p=>`<div class="round-score" style="--c:${p.c}"><span>${p.n}</span><b class="${confirmed?'confirmed-points':''}" id="allocated-${p.id}">${confirmed?'+':''}${source[p.id]||0} pts</b></div>`).join('')}</div>`}
function statsMarkup(p){return `<section class="province-statistics" aria-label="Estadísticas de ${p.n}">${STAT_ORDER.filter(name=>name!=='Seguridad'&&name in game.stats[p.id]).map(name=>{const value=game.stats[p.id][name],asset=STAT_ASSETS[name];return `<div class="province-stat" data-stat="${name}"><span class="province-stat-icon">${asset?`<img src="Assets/${asset}" alt="">`:`<span class="fallback-icon" aria-hidden="true">${STAT_ICONS[name]||'•'}</span>`}</span><span class="province-stat-label">${name==='Medio ambiente'?'Ambiente':name}:<span class="province-stat-value">${value}</span></span></div>`}).join('')}</section>`}
function provincePage(p){const scene=p.id==='ba'?"url('Assets/buenosaires.png')":"url('Assets/background1.png')";return `<div class="province-screen"><header class="province-header"><h1>${p.n}</h1></header><div class="province-wood" aria-hidden="true"></div><div class="province-landscape" style="--province-scene:${scene}" role="img" aria-label="Paisaje de ${p.n}"></div><div class="province-wood" aria-hidden="true"></div>${statsMarkup(p)}</div>`}
function toastMarkup(event){const viewProvince=P.find(p=>SL[p.id]===location.hash.slice(1));if(!viewProvince||viewProvince.id!==event.province)return '';const change=event.changes?.[0],province=P.find(p=>p.id===event.province),delta=Number(change?.delta)||0,kind=delta>0?'up':delta<0?'down':'neutral',stat=change?.stat||'Estadística',played=animatedToastIds.has(eventIdentity(event));return `<aside class="event-toast${played?' no-rise':''}" role="status" aria-live="polite"><span class="event-toast-emoji" aria-hidden="true">${event.emoji||event.title?.split(' ')[0]||'⚠️'}</span><div class="event-toast-content"><strong class="event-toast-title">${event.title?.replace(/^\S+\s*/,'')||'Evento'}</strong><span class="event-toast-province">${province?.n||'Provincia afectada'}</span><span class="event-toast-change ${kind}">${STAT_ICONS[stat]||''} ${stat} ${delta>0?'+':''}${delta}</span></div></aside>`}
function eventIdentity(event){return event.key||`${event.at}-${event.round}-${event.province}-${event.title}`}
function enqueueNewEvents(previous,next){const viewProvince=P.find(p=>SL[p.id]===location.hash.slice(1));if(!viewProvince)return false;const seen=new Set((previous.eventLog||[]).map(eventIdentity)),fresh=(next.eventLog||[]).filter(event=>!seen.has(eventIdentity(event))&&event.province===viewProvince.id&&!shownToastIds.has(eventIdentity(event))&&!queuedToastIds.has(eventIdentity(event)));if(!fresh.length)return false;for(const event of fresh){const id=eventIdentity(event);queuedToastIds.add(id);toastQueue.push(event)}return true}
function showActiveToast(){const page=$('#page');if(!page)return;page.querySelector('.event-toast')?.remove();if(activeToast){const id=eventIdentity(activeToast);page.insertAdjacentHTML('beforeend',toastMarkup(activeToast));animatedToastIds.add(id)}}
function startNextToast(){if(activeToast||!toastQueue.length)return;activeToast=toastQueue.shift();queuedToastIds.delete(eventIdentity(activeToast));showActiveToast();toastTimeout=setTimeout(advanceToast,5600)}
function advanceToast(){if(activeToast)shownToastIds.add(eventIdentity(activeToast));activeToast=null;if(toastQueue.length){activeToast=toastQueue.shift();queuedToastIds.delete(eventIdentity(activeToast));showActiveToast();toastTimeout=setTimeout(advanceToast,5600)}else{toastTimeout=null;showActiveToast()}}
function totalAllocation(a=game.allocations){return P.reduce((n,p)=>n+(Number(a[p.id])||0),0)}
function allocationPanel(){const total=totalAllocation();return `<div class="hud"><span>Asignado: <b id="assigned">${total}</b> / ${BUDGET} pts</span><span>Disponible: <b id="available">${BUDGET-total}</b> pts</span><button class="btn alt" type="button" id="clear-allocation">Limpiar reparto</button></div><div id="allocations">${P.map(p=>`<div class="row" style="--c:${p.c}"><label for="money-${p.id}">${p.e} ${p.n}</label><input type="range" id="money-${p.id}" min="0" max="${BUDGET}" step="1" value="${game.allocations[p.id]||0}" data-money="${p.id}"><div class="pts" id="money-value-${p.id}">${game.allocations[p.id]||0} pts</div></div>`).join('')}</div>${scoreRows()}<button class="btn" type="button" id="confirm-allocation" ${total===BUDGET?'':'disabled'}>Confirmar reparto</button>`}
function nationPage(){let content='';if(game.phase==='idle')content=`<div class="round-theme">TEMA DEL REPARTO: ${roundTheme()}</div><p>La Nación inicia cada ronda con 5 minutos de preparación y luego un debate de 10 minutos.</p><button class="btn" type="button" id="start-game">▶ Iniciar partida</button>`;if(game.phase==='prep')content=`<h2>Preparación de la ronda ${game.round}</h2><div class="round-theme">TEMA DEL REPARTO: ${roundTheme()}</div><p>Fase de preparación · 5 minutos.</p>`;if(game.phase==='ready')content=`<h2>Preparación terminada · ronda ${game.round}</h2><div class="round-theme">TEMA DEL REPARTO: ${roundTheme()}</div><p>Iniciá el debate para abrir el reparto. Tendrás 10 minutos.</p><button class="btn" type="button" id="start-debate">▶ Iniciar debate</button>`;if(game.phase==='distribution')content=`<h2>Debate de la ronda ${game.round}</h2><div class="round-theme">TEMA DEL REPARTO: ${roundTheme()}</div><p>El debate dura 10 minutos.</p>`;if(game.phase==='waiting')content=`<h2>Terminó el reparto de la ronda ${game.round}</h2><div class="round-theme">TEMA DEL REPARTO: ${roundTheme()}</div>${scoreRows(game.confirmedAllocations,true)}${game.round<ROUNDS?'<p>El reparto se aplicó a la Economía de cada provincia.</p><button class="btn" type="button" id="next-round">▶ Iniciar siguiente ronda</button>':'<p>Finalizaron las cinco rondas.</p>'}`;if(game.phase==='finished')content='<h2>Las cinco rondas terminaron</h2><p>La partida llegó a su fin.</p>';
  const overlay=game.phase==='distribution'?`<div class="modal-shade"><section class="modal-card" role="dialog" aria-modal="true" aria-label="Reparto de puntos"><div class="modal-clock"><span>DEBATE · RONDA ${game.round} / ${ROUNDS}</span><span class="timer" data-clock="${game.phaseEndsAt}">${formatTime(timeLeft())}</span></div><div class="round-theme">TEMA DEL REPARTO: ${roundTheme()}</div>${allocationPanel()}</section></div>`:'';
  return `${clockMarkup()}<div class="syncbox" id="sync-status"></div><div class="hero" style="--c:var(--ye)"><div class="ava">🏛️</div><div><h1>Nación</h1><div class="cls">Planificación y reparto del presupuesto</div></div></div><section class="sheet nation-sheet" style="--c:var(--ye)">${content}</section><div class="round-actions"><button class="btn alt mini" type="button" id="reset-game">Reiniciar partida</button></div>${overlay}`}
function scheduleEvents(startAt){const scheduledEvents=[];for(const province of P){const count=3+Math.floor(Math.random()*6);for(let i=0;i<count;i++){const ev=EVENTS[Math.floor(Math.random()*EVENTS.length)];scheduledEvents.push({key:`${startAt}-${province.id}-${i}`,id:ev.id,province:province.id,at:startAt+Math.floor(Math.random()*(PREP_MS-1000))+500,applied:false})}}return scheduledEvents.sort((a,b)=>a.at-b.at)}
function startPrep(state,round){const startAt=Date.now();return {...state,round,phase:'prep',phaseStartedAt:startAt,phaseEndsAt:startAt+PREP_MS,allocations:Object.fromEntries(P.map(p=>[p.id,0])),scheduledEvents:scheduleEvents(startAt)}}
function applyDueEvents(state,now){const queue=Array.isArray(state.scheduledEvents)?state.scheduledEvents:[],stats={...state.stats},eventLog=[...state.eventLog];let changed=false;const scheduledEvents=queue.map(item=>{if(item.applied||item.at>now)return item;const ev=EVENTS.find(x=>x.id===item.id);if(!ev)return {...item,applied:true};changed=true;const changes=[];if(stats[item.province]){stats[item.province]={...stats[item.province]};const before=Number(stats[item.province][ev.stat])||0,raw=before+ev.delta,after=ev.stat==='Economía'?Math.max(0,raw):Math.max(0,Math.min(100,raw));stats[item.province][ev.stat]=after;changes.push({province:item.province,stat:ev.stat,delta:after-before})}const province=P.find(p=>p.id===item.province);eventLog.push({key:item.key,emoji:ev.title.split(' ')[0],title:ev.title,description:`${province?.n||'Provincia'} · ${ev.stat} ${ev.delta>0?'+':''}${ev.delta}`,changes,province:item.province,round:state.round,at:now});return {...item,applied:true}});return changed?{...state,stats,scheduledEvents,eventLog}:state}
async function changeState(updater,shouldRender=true){const previous=game,sync=window.fondosSync;let next;if(sync?.ready&&sync.update){const saved=await sync.update(current=>updater(normalize(current)));next=normalize(saved)}else next=normalize(updater(game));const newEvents=enqueueNewEvents(previous,next),viewProvince=P.find(p=>SL[p.id]===location.hash.slice(1)),ownStatsChanged=viewProvince&&JSON.stringify(previous.stats?.[viewProvince.id])!==JSON.stringify(next.stats?.[viewProvince.id]),phaseChanged=previous.phase!==next.phase||previous.round!==next.round,allocationsChanged=JSON.stringify(previous.allocations)!==JSON.stringify(next.allocations),confirmedChanged=JSON.stringify(previous.confirmedAllocations)!==JSON.stringify(next.confirmedAllocations);game=next;setProvinceStats();saveLocal();if(newEvents)startNextToast();if(shouldRender){if(phaseChanged||(!viewProvince&&next.phase==='distribution'&&allocationsChanged)||(viewProvince&&previous.phase==='distribution'&&allocationsChanged)||(viewProvince&&previous.phase==='waiting'&&confirmedChanged))render();else if(ownStatsChanged&&viewProvince)updateProvinceStatsInPlace(viewProvince,newEvents?activeToast:null)}else{renderAllocationLive();if(ownStatsChanged&&viewProvince)updateProvinceStatsInPlace(viewProvince,newEvents?activeToast:null)}}
function renderAllocationLive(){const total=totalAllocation();const assigned=$('#assigned'),available=$('#available'),confirm=$('#confirm-allocation');if(assigned)assigned.textContent=`${total}`;if(available)available.textContent=`${BUDGET-total}`;if(confirm)confirm.disabled=total!==BUDGET;for(const p of P){const n=$(`#money-value-${p.id}`),score=$(`#allocated-${p.id}`),slider=$(`#money-${p.id}`);if(n)n.textContent=`${game.allocations[p.id]||0} pts`;if(score)score.textContent=`${game.allocations[p.id]||0} pts`;if(slider&&document.activeElement!==slider)slider.value=String(game.allocations[p.id]||0)}}
async function tick(){if(transitioning)return;const now=Date.now();if(game.phase==='prep'&&(game.scheduledEvents||[]).some(item=>!item.applied&&item.at<=now)){transitioning=true;try{await changeState(s=>applyDueEvents(s,now))}catch(e){console.warn(e)}finally{transitioning=false}return}if(game.phase==='prep'&&game.phaseEndsAt&&now>=game.phaseEndsAt){transitioning=true;try{await changeState(s=>({...s,phase:'ready',phaseStartedAt:now,phaseEndsAt:0}))}catch(e){console.warn(e)}finally{transitioning=false}}}
function updateClock(){const remaining=timeLeft();document.querySelectorAll('[data-clock]').forEach(el=>{el.textContent=formatTime(remaining);el.classList.toggle('expired',remaining===0)})}
$('#page').addEventListener('click',async e=>{if(e.target.closest('#start-game')){await changeState(s=>s.phase==='idle'?startPrep(s,1):s)}else if(e.target.closest('#start-debate')){await changeState(s=>s.phase==='ready'?{...s,phase:'distribution',phaseStartedAt:Date.now(),phaseEndsAt:Date.now()+ROUND_MS,allocations:Object.fromEntries(P.map(p=>[p.id,0]))}:s)}else if(e.target.closest('#confirm-allocation')){if(totalAllocation()!==BUDGET)return;const a={...game.allocations};await changeState(s=>{if(s.phase!=='distribution')return s;const stats={...s.stats};for(const p of P)stats[p.id]={...stats[p.id],Economía:(Number(stats[p.id]?.Economía)||0)+(Number(a[p.id])||0)};return {...s,stats,allocations:a,confirmedAllocations:a,phase:'waiting',phaseStartedAt:Date.now(),phaseEndsAt:0}})}else if(e.target.closest('#next-round')){await changeState(s=>s.phase==='waiting'&&s.round<ROUNDS?startPrep(s,s.round+1):s)}else if(e.target.closest('#clear-allocation')){await changeState(s=>({...s,allocations:Object.fromEntries(P.map(p=>[p.id,0]))}))}else if(e.target.closest('#reset-game')){if(!window.confirm('¿Reiniciar la partida y borrar su progreso?'))return;await changeState(()=>blank())}});
$('#page').addEventListener('input',e=>{const id=e.target.dataset.money;if(!id)return;const others=totalAllocation()-Number(game.allocations[id]||0),value=Math.min(Number(e.target.value),BUDGET-others);game.allocations={...game.allocations,[id]:value};e.target.value=String(value);renderAllocationLive();clearTimeout(allocTimer);allocTimer=setTimeout(()=>{const a={...game.allocations};changeState(s=>({...s,allocations:a}),false).catch(console.warn)},180)});
window.addEventListener('hashchange',render);
setInterval(()=>{updateClock();tick()},500);
window.addEventListener('fondos-sync',()=>{const sync=window.fondosSync;if(!sync.ready)return;if(!sync.state||sync.state.stateVersion!==STATE_VERSION){if(!sync.migrating&&sync.update){sync.migrating=true;sync.update(current=>current?.stateVersion===STATE_VERSION?current:migrateState(current)).then(s=>{sync.state=s;sync.migrating=false;game=normalize(s);saveLocal();render()}).catch(err=>{sync.migrating=false;sync.status='No se pudo preparar la partida: '+err.message;render()})}return}const previous=game,next=normalize(sync.state),newEvents=enqueueNewEvents(previous,next),viewProvince=P.find(p=>SL[p.id]===location.hash.slice(1)),ownStatsChanged=viewProvince&&JSON.stringify(previous.stats?.[viewProvince.id])!==JSON.stringify(next.stats?.[viewProvince.id]),phaseChanged=previous.phase!==next.phase||previous.round!==next.round,allocationsChanged=JSON.stringify(previous.allocations)!==JSON.stringify(next.allocations),confirmedChanged=JSON.stringify(previous.confirmedAllocations)!==JSON.stringify(next.confirmedAllocations);game=next;saveLocal();if(document.activeElement?.dataset?.money&&!newEvents){renderAllocationLive();return}if(newEvents)startNextToast();if(phaseChanged||(!viewProvince&&next.phase==='distribution'&&allocationsChanged)||(viewProvince&&previous.phase==='distribution'&&allocationsChanged)||(viewProvince&&previous.phase==='waiting'&&confirmedChanged))render();else if(ownStatsChanged&&viewProvince)updateProvinceStatsInPlace(viewProvince,newEvents?activeToast:null)});
window.fondosReady?.then(()=>{const sync=window.fondosSync;if(sync.ready&&sync.state?.stateVersion===STATE_VERSION){game=normalize(sync.state);saveLocal();render()}});
render();
