<style>
:root{--bg:#16123a;--panel:#241c5c;--ink:#f4f0ff;--dim:#a9a0d8;--cy:#38f0ff;--ye:#ffd23f;--mg:#ff4fa3;--gr:#5dff8a;--rd:#ff5a5a;

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'VT323','Courier New',monospace;font-size:22px;line-height:1.25;
background-image:linear-gradient(rgba(56,240,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(56,240,255,.07) 1px,transparent 1px);background-size:32px 32px}
h1,h2,h3,.px{font-family:'Press Start 2P','Courier New',monospace;font-weight:400;line-height:1.5}
nav{display:none}

main{max-width:760px;margin:0 auto;padding:16px}
.hero{display:flex;align-items:center;gap:18px;margin:14px 0 22px}
.ava{font-size:64px;width:112px;height:112px;display:grid;place-items:center;background:var(--panel);border:5px solid var(--c);box-shadow:6px 6px 0 rgba(0,0,0,.45);flex:none}

.cls{color:var(--dim);font-size:24px}
.sheet{background:var(--panel);border:4px solid var(--c);box-shadow:6px 6px 0 rgba(0,0,0,.45);padding:18px}
.stat{display:grid;grid-template-columns:120px 1fr 40px;gap:10px;align-items:center;margin:10px 0;font-size:24px}
.track{height:22px;background:var(--bg);border:3px solid var(--dim);display:flex;gap:3px;padding:2px}

.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #b38900}

.deckbar{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.left{color:var(--ye)}

.slot{aspect-ratio:3/4;max-height:180px;background:repeating-linear-gradient(45deg,#2b2470 0 8px,#241c5c 8px 16px);border:4px solid var(--dim);color:var(--dim);display:grid;place-items:center;text-align:center;padding:8px;font:inherit;cursor:default}
.slot.on{background:var(--panel);border-color:var(--c);color:var(--ink);cursor:pointer}
.slot .em{font-size:34px;display:block}.slot b{font-family:'Press Start 2P',monospace;font-weight:400;font-size:8px;line-height:1.5;color:var(--c)}
.slot.q{font-family:'Press Start 2P',monospace;font-size:26px}
.hud{background:var(--bg);border:4px solid var(--ye);padding:8px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.hud b{font-family:'Press Start 2P',monospace;font-weight:400;font-size:14px}
.ok{color:var(--gr)}.bad{color:var(--rd)}
.row{display:grid;grid-template-columns:170px 1fr 56px;gap:12px;align-items:center;padding:8px 0;border-bottom:2px dashed #3b3290}
.row label{color:var(--c)}

.pts{text-align:right;font-family:'Press Start 2P',monospace;font-size:12px}
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,7,32,.92);display:none;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));overflow:auto}
.ov.show{display:flex}
.big{position:relative;width:100%;max-width:560px;background:var(--panel);border:6px solid var(--c);box-shadow:10px 10px 0 rgba(0,0,0,.5);padding:28px 22px 24px;text-align:center;animation:fl .5s steps(5)}

.big .em{font-size:72px;line-height:1}
.big h2{font-size:clamp(14px,4vw,20px);color:var(--c);margin:14px 0}
.big p{font-size:26px;margin:0 0 14px}
.x{position:absolute;top:8px;right:8px;width:48px;height:48px;background:var(--rd);color:#fff;border:0;font-family:'Press Start 2P',monospace;font-size:18px;cursor:pointer;box-shadow:0 4px 0 #a02c2c}

.eff span{border:3px solid;padding:2px 8px;font-size:20px}
.eff .up{border-color:var(--gr);color:var(--gr)}.eff .dn{border-color:var(--rd);color:var(--rd)}
.syncbox{margin:0 0 16px;padding:10px 12px;border:3px solid var(--ye);background:var(--panel);font-size:20px}
.syncbox small{display:block;color:var(--dim);font-size:18px;margin-top:4px}
.roundbox{margin:0 0 16px;padding:12px;border:4px solid var(--cy);background:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.roundbox strong{font-family:'Press Start 2P',monospace;font-size:12px;color:var(--ye)}.timer{font-family:'Press Start 2P',monospace;font-size:clamp(18px,5vw,28px);color:var(--gr)}.timer.expired{color:var(--rd)}
.round-actions{display:flex;gap:8px;flex-wrap:wrap}.mini{font-size:10px;padding:10px 12px}
.round-scores{width:100%;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;padding-top:10px;border-top:2px dashed #3b3290}.round-score{text-align:center;min-width:0}.round-score span{display:block;color:var(--dim);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.round-score b{display:block;font-family:'Press Start 2P',monospace;font-size:clamp(17px,4vw,28px);line-height:1.5;color:var(--c)}
.round-score.you{outline:3px solid var(--ye);outline-offset:2px;background:#33287a}.round-score.you span,.round-score.you b{color:var(--ye)}.round-score .you-tag{display:inline-block;margin-bottom:3px;padding:2px 6px;border:2px solid var(--ye);color:var(--ye);font-family:'Press Start 2P',monospace;font-size:9px;line-height:1.4}
.phase-label{margin-top:6px;color:var(--cy);font-size:20px}.event-notice,.allocation-banner{margin:16px 0;padding:14px;border:3px solid var(--ye);background:var(--panel)}.event-notice strong,.allocation-banner>strong{font-family:'Press Start 2P',monospace;font-size:11px;color:var(--ye)}.event-notice p,.allocation-banner p{margin:8px 0 0}.allocation-banner{border-color:var(--rd)}.allocation-banner>strong{color:var(--rd)}.pause-shade,.modal-shade{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(10,7,32,.9);color:#fff;text-align:center;overflow:auto}.pause-card{width:min(100%,680px);max-height:calc(100dvh - 32px);overflow:auto;padding:20px;border:5px solid var(--rd);background:var(--panel);box-shadow:8px 8px 0 rgba(0,0,0,.5)}.pause-card h2{color:var(--rd);margin:0 0 8px}.pause-card p{margin:6px 0 14px}.modal-card{width:min(100%,780px);max-height:calc(100dvh - 32px);overflow:auto;padding:18px;background:var(--panel);border:5px solid var(--ye);box-shadow:8px 8px 0 rgba(0,0,0,.5);text-align:left}.modal-card h2{margin:8px 0 14px}.modal-clock{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px;border:3px solid var(--cy);font-family:'Press Start 2P',monospace;font-size:11px;color:var(--ye)}.modal-clock .timer{white-space:nowrap}.round-theme{margin:14px 0;padding:12px;border:3px solid var(--ye);color:var(--ye);font-family:'Press Start 2P',monospace;font-size:11px;line-height:1.7}.confirmed-points{color:var(--ye)!important}.nation-sheet{margin-top:16px}.nation-sheet .row{grid-template-columns:190px 1fr 70px}.nation-sheet #confirm-allocation{margin-top:18px}.nation-sheet .round-scores{margin-top:18px}
.points-note{margin-top:18px;padding:10px;border:2px dashed var(--ye);color:var(--ye)}
.stats-grid{display:grid;gap:12px}.stats-card{background:var(--bg);border:3px solid var(--c);padding:12px}.stats-card h3{font-size:11px;color:var(--c);margin:0 0 10px}.stats-card p{margin:4px 0}
.log{margin-top:18px;padding:12px;background:var(--bg);border:3px solid var(--dim)}.log h2{margin:0 0 8px}.log ul{margin:0;padding-left:24px}.log li{padding:4px 0}
.event-log{margin:12px 0;padding:12px;border:3px solid var(--event-color,var(--dim));background:var(--panel)}.event-log h3{font-size:10px;color:var(--event-color,var(--cy));margin:0 0 8px}.event-log p{margin:0 0 8px}.event-log .eff{justify-content:flex-start}
@media(max-width:520px){main{padding:10px}.stat{grid-template-columns:100px 1fr 34px;gap:6px;font-size:20px}.row,.nation-sheet .row{grid-template-columns:1fr 56px}.row input{grid-column:1/-1;grid-row:2}.ava{width:84px;height:84px;font-size:46px}.round-scores{grid-template-columns:repeat(3,minmax(0,1fr))}.roundbox{align-items:flex-start}.timer{font-size:21px}.nation-sheet{padding:12px}}

  return `<div class="province-screen nation-screen"><header class="province-header nation-header"><h1>Nación</h1></header><div class="province-wood" aria-hidden="true"></div><div class="province-landscape mirrored-scene nation-landscape" data-scene="buenosaires.png" role="img" aria-label="Paisaje de Buenos Aires"></div><div class="province-wood" aria-hidden="true"></div><section class="nation-stage"><div class="nation-stage-inner"><div class="nation-info-clock">${clockMarkup()}</div>${nationScoreboardMarkup()}<section class="sheet nation-sheet" style="--c:var(--ye)">${content}</section><div class="round-actions"><button class="btn alt mini" type="button" id="reset-game">Reiniciar partida</button></div></div></section><div class="nation-bottom" aria-hidden="true"></div></div>${overlay}`}
function startPrep(state,round){const startAt=sharedNow();return {...state,round,phase:'prep',phaseStartedAt:startAt,phaseEndsAt:startAt+PREP_MS,nextRandomEventAt:startAt+randomEventDelay(),allocations:Object.fromEntries(P.map(p=>[p.id,0])),scheduledEvents:[]}}async function changeState(updater,shouldRender=true){let sync=window.fondosSync;if(sync&&!sync.stateReady&&!sync.localOnly&&(sync.bootstrapping||sync.update))await window.fondosStateReadyPromise;sync=window.fondosSync;const previous=game;let next;if(sync?.ready&&sync.update&&!sync.localOnly){const saved=await sync.update(current=>updater(normalize(current)));next=normalize(saved)}else next=normalize(updater(game));const oldEventIds=new Set((previous.eventLog||[]).map(eventIdentity)),newMeteorEvents=(next.eventLog||[]).filter(event=>METEOR_EVENT_IDS.has(event.id)&&!oldEventIds.has(eventIdentity(event))),newEvents=enqueueNewEvents(previous,next),viewProvince=P.find(p=>SL[p.id]===location.hash.slice(1)),ownStatsChanged=viewProvince&&JSON.stringify(previous.stats?.[viewProvince.id])!==JSON.stringify(next.stats?.[viewProvince.id]),moneyChanged=JSON.stringify(previous.money)!==JSON.stringify(next.money),peopleChanged=JSON.stringify(previous.people)!==JSON.stringify(next.people),phaseChanged=previous.phase!==next.phase||previous.round!==next.round,allocationsChanged=JSON.stringify(previous.allocations)!==JSON.stringify(next.allocations),confirmedChanged=JSON.stringify(previous.confirmedAllocations)!==JSON.stringify(next.confirmedAllocations);game=next;setProvinceStats();saveLocal();for(const province of P)reconcileProvincePeople(province,next.people?.[province.id]||[]);newMeteorEvents.forEach(runMeteorShower);if(newEvents)startNextToast();if(location.hash==='#admin'){updateAdminStats(previous,next);return}if(location.hash==='#moderator'){updateModeratorStats(previous,next);return}if(viewProvince){const additions=newlyAddedPeople(previous,next,viewProvince);if(additions.length)renderProvincePeople(viewProvince,additi function renderAllocationLive(){const total=totalAllocation();const assigned=$('#assigned'),available=$('#available'),confirm=$('#confirm-allocation');if(assigned)assigned.textContent=`${total}`;if(available)available.textContent=`${BUDGET-total}`;if(confirm)confirm.disabled=total!==BUDGET;for(const p of P){const n=$(`#money-value-${p.id}`),score=$(`#allocated-${p.id}`),slider=$(`#money-${p.id}`);if(n)n.textContent=`${game.allocations[p.id]||0} pts`;if(score)score.textContent=`${game.allocations[p.id]||0} pts`;if(slider&&document.activeElement!==slider)slider.value=String(game.allocations[p.id]||0)}}
let incomeWriteInFlight=false;async function accruePopulationIncome(){const second=Math.floor(sharedNow()/1000),last=Number(game.lastPersonIncomeSecond)||0;if(!second||second<=last||incomeWriteInFlight)return;incomeWriteInFlight=true;try{await changeState(state=>{const paidThrough=Number(state.lastPersonIncomeSecond)||0;if(second<=paidThrough)return state;if(!paidThrough)return {...state,lastPersonIncomeSecond:second};const elapsedSeconds=Math.max(0,second-paidThrough);if(!elapsedSeconds)return {...state,lastPersonIncomeSecond:second};const money={...state.money};for(const province of P)money[province.id]=Math.round(((Number(money[province.id])||0)+(state.people?.[province.id]||[]).length*0.1*elapsedSeconds)*10)/10;return {...state,money,lastPersonIncomeSecond:second}})}finally{incomeWriteInFlight=false}}async function tick(){accruePopulationIncome().catch(error=>console.warn('No se pudo acreditar el ingreso por población',error));if(transitioning)return;const now=sharedNow();if(game.phase==='prep'&&game.phaseEndsAt&&now>=game.phaseEndsAt){transitioning=true;try{await changeState(s=>({...s,phase:'ready',phaseStartedAt:now,phaseEndsAt:0,nextRandomEventAt:0,scheduledEvents:[]}))}catch(e){console.warn(e)}finally{transitioning=false}return}if(!['prep','distribution'].includes(game.phase)||!game.nextRandomEventAt||now<game.nextRandomEventAt)return;transitioning=true;const event=pickRandomEvent(),province=P[Math.floor(Math.random()*P.length)],changes=rollEventChanges(event),eventClock=now,key=`random-${eventClock}-${Math.random().toString(36).slice(2,8)}`,meteorDurationMs=METEOR_EVENT_IDS.has(event.id)?10000+Math.floor(Math.random()*10001):0,nextEventDelay=randomEventDelay();try{await changeState(s=>{const appliedAt=sharedNow();if(!['prep','distribution'].includes(s.phase)||!s.nextRandomEventAt||appliedAt<s.nextRandomEventAt)return s;const updated=applyEventToState(s,province,event,changes,appliedAt,key,meteorDurationMs,false);return {...updated,nextRandomEventAt:appliedA $('#page').addEventListener('click',async e=>{const eventScroll=e.target.closest('[data-admin-event-scroll]');if(eventScroll){scrollAdminEvents(Number(eventScroll.dataset.adminEventScroll));return}const invoke=e.target.closest('[data-invoke-event]');if(invoke){invokeAdminEvent(invoke.dataset.invokeEvent).catch(console.warn);return}const moderatorArrow=e.target.closest('[data-moderator-step]');if(moderatorArrow){setModeratorProvince(moderatorProvinceIndex+Number(moderatorArrow.dataset.moderatorStep));return}const adminArrow=e.target.closest('[data-admin-step]');if(adminArrow){setAdminProvince(adminProvinceIndex+Number(adminArrow.dataset.adminStep));return}const addPerson=e.target.closest('[data-add-person]');if(addPerson){addProvincePerson().catch(console.warn);return}const statImprove=e.target.closest('[data-stat-improve]');if(statImprove){applySingleStatImprovement(statImprove.dataset.statImprove,statImprove.dataset.statName).catch(console.warn);return}const upgrade=e.target.closest('[data-upgrade]');if(upgrade){applyProvinceImprovement(upgrade.dataset.upgrade).catch(console.warn);return}const section=e.target.closest('[data-province-section]');if(section){setProvinceSection(section.dataset.provinceSection);return}if(e.target.closest('#start-game')){await changeState(s=>s.phase==='idle'?startPrep(s,1):s)}else if(e.target.closest('#start-debate')){await changeState(s=>{const now=sharedNow();return s.phase==='ready'?{...s,phase:'distribution',phaseStartedAt:now,phaseEndsAt:now+ROUND_MS,nextRandomEventAt:now+randomEventDelay(),allocations:Object.fromEntries(P.map(p=>[p.id,0]))}:s})}else if(e.target.closest('#confirm-allocation')){if(totalAllocation()!==BUDGET)return;const a={...game.allocations};await changeState(s=>{if(s.phase!=='distribution')return s;const money={...s.money};for(const p of P)money[p.id]=(Number(money[p.id])||0)+(Number(a[p.id])||0);return {...s,money,allocations:a,confirmedAllocations:a,phase:'waiting',phaseStartedAt:Date.now(),phaseEndsAt:0,nextRa
